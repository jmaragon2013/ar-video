<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      #invitation-button {
        position: fixed;
        right: 120px;
        bottom: 120px;
        z-index: 1001;
        background: #312731;
        color: #ECDFEE;
        padding: 10px 14px;
        border-radius: 8px;
        font-weight: 600;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.25);
        -webkit-tap-highlight-color: transparent;
      }
      #invitation-button.hidden { display: none; }
      #invitation-button:active { transform: translateY(1px); }

      #play-button {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 1002;
        background: #312731;
        color: #ECDFEE;
        padding: 10px 12px;
        border-radius: 8px;
        border: 0;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.25);
        -webkit-tap-highlight-color: transparent;
        cursor: pointer;
        font-weight: 600;
      }
      #play-button:active { transform: translateY(1px); }
    </style>
  </head>

  <body>
    <a-scene mindar-image="imageTargetSrc: assets/targets.mind; filterMinCF:0.0001; filterBeta: 0.001;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <video id="parejaVideo" src="assets/ra_bueno.webm" preload="auto" playsinline webkit-playsinline crossorigin="anonymous"></video>
      </a-assets>

      <a-camera id="camera" position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="targetEntity">
        <a-video
          id="overlayVideo"
          src="#parejaVideo"
          position="0 0.9 0"
          height="1"
          width="1"
          rotation="0 0 0"
          opacity="0.95"
        ></a-video>
      </a-entity>
    </a-scene>

    <a id="invitation-button" class="hidden" href="https://sample.lunarie.es" target="_blank" rel="noopener noreferrer" aria-label="Invitación digital">
      Invitación digital
    </a>

    <button id="play-button" aria-label="Iniciar vídeo" title="Iniciar vídeo" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 3v18l15-9L5 3z" fill="currentColor"/></svg>
      Reproducir
    </button>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const target = document.getElementById('targetEntity');
        const htmlBtn = document.getElementById('invitation-button');
        const playBtn = document.getElementById('play-button');
        const videoEl = document.getElementById('parejaVideo');

        let isTargetVisible = false;

        if (target) {
          target.setAttribute('visible', 'false');
          target.addEventListener('targetFound', function () {
            isTargetVisible = true;
            target.setAttribute('visible', 'true');
            if (playBtn && videoEl.paused) playBtn.style.display = 'inline-flex';
          });
          target.addEventListener('targetLost', function () {
            isTargetVisible = false;
            target.setAttribute('visible', 'false');
            if (playBtn) playBtn.style.display = 'none';
          });
        }

        if (htmlBtn) {
          htmlBtn.classList.add('hidden');
          if (target) {
            target.addEventListener('targetFound', function () { htmlBtn.classList.remove('hidden'); });
            target.addEventListener('targetLost', function () { htmlBtn.classList.add('hidden'); });
          } else {
            htmlBtn.classList.remove('hidden');
          }

          htmlBtn.addEventListener('click', function (e) {
            e.preventDefault();
            const win = window.open(htmlBtn.getAttribute('href'), '_blank');
            if (!win) window.location.href = htmlBtn.getAttribute('href');
          });
        }

        if (playBtn && videoEl) {
          playBtn.style.display = 'none';

          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          let audioCtx = null;
          let mediaSource = null;

          const startPlayback = async () => {
            try {
              if (AudioCtx && !audioCtx) {
                audioCtx = new AudioCtx();
              }
              if (audioCtx && audioCtx.state === 'suspended') {
                await audioCtx.resume();
              }
              if (audioCtx && !mediaSource) {
                try {
                  mediaSource = audioCtx.createMediaElementSource(videoEl);
                  mediaSource.connect(audioCtx.destination);
                } catch (err) {
                  mediaSource = null;
                }
              }

              videoEl.loop = false;
              videoEl.currentTime = 0;
              videoEl.muted = false;

              await videoEl.play();
              playBtn.style.display = 'none';
            } catch (err) {
              console.warn('No se pudo reproducir el vídeo con audio tras la interacción:', err);
            }
          };

          playBtn.addEventListener('click', startPlayback);

          videoEl.addEventListener('ended', () => {
            videoEl.pause();
            videoEl.currentTime = 0;
            if (isTargetVisible) {
              playBtn.style.display = 'inline-flex';
            } else {
              playBtn.style.display = 'none';
            }
          });
        }
      });
    </script>
  </body>
</html>
